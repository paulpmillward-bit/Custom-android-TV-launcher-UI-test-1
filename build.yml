              private val screen = mutableStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  onBackPressedDispatcher.addCallback(this) {
                      if (screen.value != 0) screen.value = 0
                  }
                  setContent { LauncherScreen(refresh.intValue, screen) }
              }

              override fun onResume() {
                  super.onResume()
                  screen.value = 0
                  refresh.intValue = refresh.intValue + 1
              }
          }

          // ---------- loading ----------

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val leanback = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
              val normal = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              val found = (pm.queryIntentActivities(leanback, 0) + pm.queryIntentActivities(normal, 0))
                  .filter { it.activityInfo.packageName != ctx.packageName }
                  .filter { it.activityInfo.packageName !in STOCK_LAUNCHERS }
                  .distinctBy { it.activityInfo.packageName }
              return found.map { ri ->
                  val ai = ri.activityInfo
                  val comp = ComponentName(ai.packageName, ai.name)
                  APP_CACHE.getOrPut(comp.flattenToString()) {
                      val banner = ai.loadBanner(pm)
                      val bmp = if (banner != null) banner.toBitmap(320, 180) else ai.loadIcon(pm).toBitmap(128, 128)
                      AppItem(ri.loadLabel(pm).toString(), comp, bmp.asImageBitmap(), banner != null)
                  }
              }.sortedBy { it.label.lowercase() }
          }

          fun recentPackages(ctx: Context): List<String> =
              ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
                  .getString("recent", "").orEmpty().split(",").filter { it.isNotBlank() }

          fun pushRecent(ctx: Context, pkg: String) {
              val list = (listOf(pkg) + recentPackages(ctx).filter { it != pkg }).take(8)
              ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
                  .edit().putString("recent", list.joinToString(",")).apply()
          }

          fun launchApp(ctx: Context, app: AppItem) {
              pushRecent(ctx, app.component.packageName)
              runCatching {
                  ctx.startActivity(
                      Intent(Intent.ACTION_MAIN).setComponent(app.component).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }

          fun openSystem(ctx: Context, action: String) {
              runCatching {
