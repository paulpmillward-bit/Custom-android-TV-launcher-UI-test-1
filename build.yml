                                  cursorBrush = SolidColor(Color.White),
                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                                  keyboardActions = KeyboardActions(onDone = {
                                      prefs.updateTown(text.trim())
                                      editing = false
                                  }),
                                  modifier = Modifier.focusRequester(fr)
                              )
                          }
                          Chip("Save") {
                              prefs.updateTown(text.trim())
                              editing = false
                          }
                          Chip("Cancel") { editing = false }
                      }
                      LaunchedEffect(Unit) {
                          delay(100)
                          runCatching { fr.requestFocus() }
                      }
                  }
              }
          }

          // ---------- shared widgets ----------

          @Composable
          fun Chip(text: String, selected: Boolean = false, onClick: () -> Unit) {
              FocusScale(
                  modifier = Modifier.height(42.dp),
                  bg = if (selected) Color(0xFFFFFFFF) else Color(0x33FFFFFF),
                  onClick = onClick
              ) {
                  Text(
                      text,
                      color = if (selected) Color(0xFF0A2535) else Color.White,
                      fontSize = 15.sp,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      modifier = Modifier.padding(horizontal = 16.dp).align(Alignment.Center)
                  )
              }
          }

          @Composable
          fun IconBtn(kind: Int, dim: Boolean = false, onClick: () -> Unit) {
              FocusScale(modifier = Modifier.size(46.dp), bg = Color(0x22FFFFFF), onClick = onClick) {
                  Canvas(Modifier.fillMaxSize().padding(10.dp)) {
                      drawIcon(kind, if (dim) Color(0x77FFFFFF) else Color.White)
                  }
              }
          }

          fun DrawScope.drawIcon(kind: Int, c: Color) {
              val w = size.width
              val h = size.height
              val sw = w * 0.1f
              val st = Stroke(width = sw, cap = StrokeCap.Round)
              when (kind) {
                  0 -> {
                      val cx = w / 2
                      val cy = h * 0.85f
                      for (r in listOf(w * 0.24f, w * 0.44f, w * 0.64f)) {
                          drawArc(c, 225f, 90f, false, Offset(cx - r, cy - r), Size(2 * r, 2 * r), style = st)
                      }
                      drawCircle(c, sw * 0.9f, Offset(cx, cy))
                  }
                  1 -> {
                      drawCircle(c, w * 0.17f, Offset(w / 2, h / 2), style = st)
                      drawCircle(
                          c,
                          w * 0.36f,
                          Offset(w / 2, h / 2),
                          style = Stroke(width = w * 0.16f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(w * 0.14f, w * 0.14f)))
                      )
                  }
                  3 -> {
                      for (a in 0..2) {
                          for (b in 0..2) {
                              drawCircle(c, w * 0.09f, Offset(w * (0.2f + 0.3f * a), h * (0.2f + 0.3f * b)))
                          }
                      }
                  }
                  else -> {
                      val ys = listOf(0.25f, 0.5f, 0.75f)
                      val xs = listOf(0.3f, 0.7f, 0.45f)
                      for (k in 0..2) {
                          val y = h * ys[k]
                          drawLine(c, Offset(0.05f * w, y), Offset(0.95f * w, y), strokeWidth = sw, cap = StrokeCap.Round)
                          drawCircle(c, sw * 1.3f, Offset(w * xs[k], y))
                      }
                  }
              }
          }

          @Composable
          fun AllAppsFace() {
              Column(
                  Modifier.fillMaxSize(),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Canvas(Modifier.size(26.dp)) { drawIcon(3, Color.White) }
                  Spacer(Modifier.height(6.dp))
                  Text("All apps", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          fun AppFace(app: AppItem, textColor: Color) {
              if (app.isBanner) {
                  Image(
                      bitmap = app.image,
                      contentDescription = app.label,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.fillMaxSize()
                  )
              } else {
                  Column(
                      Modifier.fillMaxSize(),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Image(bitmap = app.image, contentDescription = null, modifier = Modifier.size(40.dp))
                      Spacer(Modifier.height(6.dp))
                      Text(
                          app.label,
                          color = textColor,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          @Composable
          fun FocusScale(
              modifier: Modifier = Modifier,
              bg: Color,
              focusRequester: FocusRequester? = null,
              highlighted: Boolean = false,
              onFocus: (() -> Unit)? = null,
              onLongClick: (() -> Unit)? = null,
              onClick: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val st = LocalStyle.current
              var focused by remember { mutableStateOf(false) }
              val target = if (highlighted) st.scale + 0.08f else if (focused) st.scale else 1f
              val scale by animateFloatAsState(target, tween(st.animMs), label = "scale")
              val shape = RoundedCornerShape(st.corner)
              val longDone = remember { BooleanArray(1) }
              val clickNow by rememberUpdatedState(onClick)
              val longNow by rememberUpdatedState(onLongClick)
              val base = if (focusRequester != null) modifier.focusRequester(focusRequester) else modifier
              val borderMod = if (highlighted) {
                  Modifier.border(4.dp, Color(0xFFFFC107), shape)
              } else if (focused && st.highlight != null) {
                  Modifier.border(4.dp, st.highlight, shape)
              } else {
                  Modifier
              }
              Box(
                  base
                      .zIndex(if (focused || highlighted) 1f else 0f)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .clip(shape)
                      .background(bg)
                      .onKeyEvent { ev ->
                          val k = ev.nativeKeyEvent
                          val sel = k.keyCode == AKeyEvent.KEYCODE_DPAD_CENTER ||
                              k.keyCode == AKeyEvent.KEYCODE_ENTER ||
                              k.keyCode == AKeyEvent.KEYCODE_NUMPAD_ENTER
                          if (!sel) {
                              false
                          } else if (k.action == AKeyEvent.ACTION_DOWN) {
                              if (k.repeatCount == 0) {
                                  longDone[0] = false
                              } else if (!longDone[0] && onLongClick != null) {
                                  longDone[0] = true
                                  onLongClick()
                              }
                              true
                          } else if (k.action == AKeyEvent.ACTION_UP) {
                              if (!longDone[0]) onClick()
                              longDone[0] = false
                              true
                          } else {
                              false
                          }
                      }
                      .onFocusChanged {
                          focused = it.isFocused
                          if (it.isFocused) onFocus?.invoke()
                      }
                      .focusable()
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onTap = { clickNow() },
                              onLongPress = { longNow?.invoke() }
                          )
                      }
                      .then(borderMod),
                  content = content
              )
          }

          @Composable
          fun Clock(h24: Boolean) {
              val time by produceState("", h24) {
                  while (true) {
                      value = SimpleDateFormat(if (h24) "HH:mm" else "h:mm", Locale.getDefault()).format(Date())
                      delay(15000L)
                  }
              }
              Text(time, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.SemiBold)
          }
          __END__
          find . -name '*.kt' -o -name '*.kts' -o -name '*.xml' | grep -v '^./.git' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install signing key
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore app/debug.keystore
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Launcher build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
