          fun styleOf(p: LauncherPrefs): UiStyle {
              val corner = when (p.num("corner")) {
                  0 -> 6.dp
                  2 -> 30.dp
                  else -> 18.dp
              }
              var hl: Color? = when (p.num("focus")) {
                  1 -> Color(0xFFFFC107)
                  2 -> Color(0xFF4DD0E1)
                  3 -> null
                  else -> Color.White
              }
              val scale = when (p.num("anim")) {
                  0 -> 1f
                  2 -> 1.12f
                  else -> 1.08f
              }
              val ms = when (p.num("anim")) {
                  0 -> 0
                  2 -> 220
                  else -> 110
              }
              if (hl == null && scale == 1f) hl = Color.White
              return UiStyle(corner, hl, scale, ms)
          }

          fun themeOf(p: LauncherPrefs): ThemeColors = THEMES[p.num("theme").coerceIn(0, THEMES.size - 1)]

          fun bgBrush(p: LauncherPrefs): Brush {
              val t = themeOf(p)
              return when (p.num("bg")) {
                  1 -> SolidColor(t.mid)
                  2 -> SolidColor(t.edge)
                  else -> Brush.verticalGradient(0f to t.edge, 0.36f to t.mid, 0.60f to t.mid, 1f to t.edge)
              }
          }

          fun themeBrush(t: ThemeColors): Brush = Brush.verticalGradient(
              0f to t.edge,
              0.36f to t.mid,
              0.60f to t.mid,
              1f to t.edge
          )

          class LauncherPrefs(ctx: Context) {
              private val sp = ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
              private val ints = mutableStateMapOf<String, Int>()

              init {
                  for ((k, d) in DEFAULTS) {
                      ints[k] = sp.getInt("i_" + k, d)
                  }
              }

              private fun readList(k: String): List<String> =
                  sp.getString(k, "").orEmpty().split(",").filter { it.isNotBlank() }

              var town by mutableStateOf(sp.getString("town", "").orEmpty())
                  private set
              var order by mutableStateOf(readList("order"))
                  private set
              var hidden by mutableStateOf(readList("hidden").toSet())
                  private set

              fun num(k: String): Int = ints[k] ?: (DEFAULTS[k] ?: 0)

              fun setNum(k: String, v: Int) {
                  ints[k] = v
                  sp.edit().putInt("i_" + k, v).apply()
              }

              fun updateTown(v: String) {
                  town = v
                  sp.edit().putString("town", v).apply()
              }

              fun updateOrder(v: List<String>) {
                  order = v
                  sp.edit().putString("order", v.joinToString(",")).apply()
              }

              fun updateHidden(v: Set<String>) {
                  hidden = v
                  sp.edit().putString("hidden", v.joinToString(",")).apply()
              }
          }

