              }
          }

          fun isOnline(ctx: Context): Boolean = try {
              val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              val caps = cm.getNetworkCapabilities(cm.activeNetwork)
              caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
          } catch (e: Exception) {
              true
          }

          fun httpGet(u: String): String {
              val c = URL(u).openConnection() as HttpURLConnection
              c.connectTimeout = 8000
              c.readTimeout = 8000
              return try {
                  c.inputStream.bufferedReader().readText()
              } finally {
                  c.disconnect()
              }
          }

          suspend fun fetchTemp(town: String, fahrenheit: Boolean): String? = withContext(Dispatchers.IO) {
              try {
                  val g = httpGet("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + URLEncoder.encode(town, "UTF-8"))
                  val results = JSONObject(g).optJSONArray("results") ?: return@withContext null
                  val o = results.getJSONObject(0)
                  val lat = o.getDouble("latitude")
                  val lon = o.getDouble("longitude")
                  val unit = if (fahrenheit) "&temperature_unit=fahrenheit" else ""
                  val w = httpGet("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m" + unit)
                  val t = JSONObject(w).getJSONObject("current").getDouble("temperature_2m")
                  Math.round(t).toInt().toString() + "\u00B0"
              } catch (e: Exception) {
                  null
              }
          }

          fun loadBitmap(ctx: Context, uriStr: String?): ImageBitmap? {
              if (uriStr.isNullOrBlank()) return null
              IMG_CACHE[uriStr]?.let { return it }
              return try {
                  val u = Uri.parse(uriStr)
                  val stream = if (u.scheme == "http" || u.scheme == "https") {
                      URL(uriStr).openStream()
                  } else {
                      ctx.contentResolver.openInputStream(u)
                  }
                  val bytes = stream?.use { it.readBytes() } ?: return null
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                  var sample = 1
                  while (o.outWidth / sample > 900) sample *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = sample
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o2)?.asImageBitmap()
                  if (bmp != null) {
                      if (IMG_CACHE.size > 30) IMG_CACHE.clear()
                      IMG_CACHE[uriStr] = bmp
                  }
                  bmp
              } catch (e: Exception) {
                  null
              }
          }

          fun loadWatchNext(ctx: Context): WatchResult {
              try {
                  val cur = ctx.contentResolver.query(
                      Uri.parse("content://android.media.tv/watch_next_program"),
                      null, null, null, "last_engagement_time_utc_millis DESC"
                  ) ?: return WatchResult(emptyList(), "no data returned")
                  val out = ArrayList<WatchItem>()
                  var rows = 0
                  cur.use { c ->
                      val iTitle = c.getColumnIndex("title")
                      val iPoster = c.getColumnIndex("poster_art_uri")
                      val iThumb = c.getColumnIndex("thumbnail_uri")
                      val iIntent = c.getColumnIndex("intent_uri")
                      val iPos = c.getColumnIndex("last_playback_position_millis")
                      val iDur = c.getColumnIndex("duration_millis")
                      val iType = c.getColumnIndex("watch_next_type")
                      val iPkg = c.getColumnIndex("package_name")
                      while (c.moveToNext() && out.size < 8) {
                          rows++
                          val type = if (iType >= 0) c.getInt(iType) else 0
                          if (type > 1) continue
                          val intentUri: String? = if (iIntent >= 0) c.getString(iIntent) else null
                          if (intentUri.isNullOrBlank()) continue
                          val title = if (iTitle >= 0) c.getString(iTitle).orEmpty() else ""
                          val posterA: String? = if (iPoster >= 0) c.getString(iPoster) else null
                          val posterB: String? = if (iThumb >= 0) c.getString(iThumb) else null
                          val pos = if (iPos >= 0) c.getLong(iPos) else 0L
                          val dur = if (iDur >= 0) c.getLong(iDur) else 0L
                          val prog = if (dur > 0) (pos.toFloat() / dur.toFloat()).coerceIn(0f, 1f) else 0f
                          val pkg: String? = if (iPkg >= 0) c.getString(iPkg) else null
                          var badge: ImageBitmap? = null
                          if (pkg != null) {
                              badge = IMG_CACHE["badge:" + pkg]
                              if (badge == null) {
                                  badge = try {
                                      ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap()
                                  } catch (e: Exception) {
                                      null
                                  }
                                  if (badge != null) IMG_CACHE["badge:" + pkg] = badge
                              }
                          }
                          out.add(WatchItem(title, intentUri, loadBitmap(ctx, posterA ?: posterB), badge, prog))
                      }
                  }
                  val status = if (out.isNotEmpty()) {
                      "OK, " + out.size + " items"
                  } else {
                      "allowed but nothing to show (" + rows + " rows)"
                  }
                  return WatchResult(out, status)
              } catch (e: Exception) {
                  return WatchResult(emptyList(), "not available: " + (e.message ?: e.javaClass.simpleName))
              }
          }

          fun openWatch(ctx: Context, w: WatchItem) {
              runCatching {
                  ctx.startActivity(
                      Intent.parseUri(w.intentUri, Intent.URI_INTENT_SCHEME).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }

          fun moveInList(ordered: List<AppItem>, pkg: String, delta: Int): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              val i = l.indexOf(pkg)
              if (i < 0) return l
              val j = (i + delta).coerceIn(0, l.size - 1)
              l.removeAt(i)
              l.add(j, pkg)
              return l
          }

          fun frontInList(ordered: List<AppItem>, pkg: String): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              l.remove(pkg)
              l.add(0, pkg)
              return l
          }

          fun swapInList(ordered: List<AppItem>, a: String, b: String): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              val i = l.indexOf(a)
              val j = l.indexOf(b)
              if (i < 0 || j < 0) return l
              l[i] = b
              l[j] = a
              return l
          }

          // ---------- root ----------

          @Composable
          fun LauncherScreen(refresh: Int, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val prefs = remember { LauncherPrefs(ctx) }
              var reload by remember { mutableIntStateOf(0) }
              val apps by produceState(emptyList<AppItem>(), refresh, reload) {
                  value = withContext(Dispatchers.Default) { loadApps(ctx) }
              }
              val ordered = remember(apps, prefs.order) {
                  val idx = prefs.order.withIndex().associate { it.value to it.index }
                  apps.sortedWith(
                      compareBy<AppItem>(
                          { idx[it.component.packageName] ?: Int.MAX_VALUE },
                          { it.label.lowercase() }
                      )
                  )
              }
              val style = remember(prefs.num("corner"), prefs.num("focus"), prefs.num("anim")) { styleOf(prefs) }
              CompositionLocalProvider(LocalStyle provides style) {
                  when (screen.value) {
                      1 -> AllAppsScreen(prefs, ordered)
                      2 -> SettingsScreen(
                          prefs,
                          ordered,
                          onDone = { screen.value = 0 },
                          onRefreshApps = {
                              APP_CACHE.clear()
                              reload = reload + 1
                          }
                      )
                      else -> HomeScreen(prefs, ordered, refresh, screen)
                  }
              }
          }

          // ---------- home ----------

          @Composable
          fun HomeScreen(prefs: LauncherPrefs, ordered: List<AppItem>, refresh: Int, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val st = LocalStyle.current
              val visible = ordered.filter { it.component.packageName !in prefs.hidden }
              val dockN = 3 + prefs.num("dockCount").coerceIn(0, 2)
              val dockApps = visible.take(dockN)
              val topMode = prefs.num("topMode")
              val si = prefs.num("topSize").coerceIn(0, 2)
              val recent = remember(ordered, refresh) {
                  recentPackages(ctx).mapNotNull { p -> ordered.find { it.component.packageName == p } }
              }
              val visibleRecent = recent.filter { it.component.packageName !in prefs.hidden }
              val recentRow = if (visibleRecent.isEmpty()) visible.take(4) else visibleRecent.take(6)

              val watch by produceState(WatchResult(emptyList(), ""), refresh, topMode) {
                  if (topMode == 0) {
                      while (true) {
                          val r = withContext(Dispatchers.IO) { loadWatchNext(ctx) }
                          watchStatus = r.status
                          value = r
                          delay(120000L)
                      }
                  } else {
                      value = WatchResult(emptyList(), "off")
                  }
              }

              var moving by remember { mutableStateOf<String?>(null) }
              val firstDock = remember { FocusRequester() }
              val moveReq = remember { FocusRequester() }
              LaunchedEffect(dockApps.size) {
                  if (dockApps.isNotEmpty()) {
                      delay(150)
                      runCatching { firstDock.requestFocus() }
                  }
              }
              LaunchedEffect(prefs.order, moving) {
                  if (moving != null) {
                      delay(40)
                      runCatching { moveReq.requestFocus() }
                  }
              }

              val showWatch = topMode == 0 && watch.items.isNotEmpty()

              Column(
                  Modifier
                      .fillMaxSize()
                      .background(bgBrush(prefs))
                      .padding(horizontal = 40.dp, vertical = 20.dp)
                      .onPreviewKeyEvent { ev ->
                          val m = moving
                          val k = ev.nativeKeyEvent
                          val code = k.keyCode
                          val isSel = code == AKeyEvent.KEYCODE_DPAD_CENTER ||
                              code == AKeyEvent.KEYCODE_ENTER ||
                              code == AKeyEvent.KEYCODE_NUMPAD_ENTER
                          val isLR = code == AKeyEvent.KEYCODE_DPAD_LEFT || code == AKeyEvent.KEYCODE_DPAD_RIGHT
                          if (m == null) {
                              false
                          } else if (k.action == AKeyEvent.ACTION_UP) {
                              isSel || isLR
                          } else if (isLR) {
                              val i = dockApps.indexOfFirst { it.component.packageName == m }
                              val j = if (code == AKeyEvent.KEYCODE_DPAD_LEFT) i - 1 else i + 1
                              if (i >= 0 && j in dockApps.indices) {
                                  prefs.updateOrder(swapInList(ordered, m, dockApps[j].component.packageName))
                              }
                              true
                          } else if (isSel) {
                              if (k.repeatCount == 0) moving = null
                              true
                          } else if (code == AKeyEvent.KEYCODE_BACK) {
                              moving = null
                              true
                          } else {
                              moving = null
                              false
                          }
                      }
              ) {
                  TopBar(prefs, screen)
                  if (topMode != 2) {
                      Spacer(Modifier.height(10.dp))
                      Text(
                          if (showWatch) "Continue Watching" else "Jump Back In",
                          color = Color.White,
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.padding(start = 8.dp)
                      )
                      LazyRow(
                          horizontalArrangement = Arrangement.spacedBy(22.dp),
                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 16.dp)
                      ) {
                          if (showWatch) {
                              items(watch.items) { w ->
                                  Column(Modifier.width(TOP_W[si].dp)) {
                                      FocusScale(
                                          modifier = Modifier.fillMaxWidth().aspectRatio(16f / 9f),
                                          bg = Color(0xFF0E2E40),
                                          onClick = { openWatch(ctx, w) }
                                      ) {
                                          if (w.poster != null) {
                                              Image(
                                                  bitmap = w.poster,
                                                  contentDescription = w.title,
                                                  contentScale = ContentScale.Crop,
                                                  modifier = Modifier.fillMaxSize()
                                              )
                                          } else {
                                              Text(
                                                  w.title,
                                                  color = Color.White,
                                                  fontSize = 18.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  modifier = Modifier.align(Alignment.Center)
                                              )
                                          }
                                          Text(
                                              "Continue",
                                              color = Color.White,
                                              fontSize = 14.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier
                                                  .align(Alignment.BottomStart)
                                                  .padding(start = 14.dp, bottom = 22.dp)
                                          )
                                          Box(
                                              Modifier
                                                  .align(Alignment.BottomStart)
                                                  .padding(horizontal = 14.dp, vertical = 10.dp)
                                                  .fillMaxWidth()
                                                  .height(4.dp)
                                                  .background(Color(0x66FFFFFF))
                                          ) {
                                              Box(Modifier.fillMaxWidth(w.progress).fillMaxHeight().background(Color.White))
                                          }
                                          if (w.badge != null) {
                                              Image(
                                                  bitmap = w.badge,
                                                  contentDescription = null,
                                                  modifier = Modifier
                                                      .align(Alignment.TopEnd)
                                                      .padding(10.dp)
                                                      .size(28.dp)
                                                      .clip(RoundedCornerShape(7.dp))
                                              )
                                          }
                                      }
                                      Spacer(Modifier.height(8.dp))
                                      Text(
                                          w.title,
                                          color = Color.White,
                                          fontSize = 16.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                          textAlign = TextAlign.Center,
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }
                              }
                          } else {
                              items(recentRow, key = { it.component.packageName }) { app ->
                                  Column(Modifier.width(TOP_W[si].dp)) {
                                      FocusScale(
                                          modifier = Modifier.fillMaxWidth().aspectRatio(16f / 9f),
                                          bg = Color(0xFF0E2E40),
                                          onClick = { launchApp(ctx, app) }
                                      ) { AppFace(app, Color.White) }
                                      Spacer(Modifier.height(8.dp))
                                      Text(
                                          app.label,
                                          color = Color.White,
                                          fontSize = 16.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                          textAlign = TextAlign.Center,
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }
                              }
                          }
                      }
                  }
                  Spacer(Modifier.weight(1f))
                  if (moving != null) {
                      Text(
                          "Moving: use the left and right buttons, then press OK to drop",
                          color = Color(0xFFFFC107),
                          fontSize = 15.sp,
                          fontWeight = FontWeight.SemiBold,
                          modifier = Modifier.padding(start = 8.dp, bottom = 8.dp)
                      )
                  }
                  Row(
                      Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(st.corner + 12.dp))
                          .background(Color(0x5A0A2840))
                          .padding(14.dp),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      dockApps.forEachIndexed { i, app ->
                          val pkg = app.component.packageName
                          key(pkg) {
                              FocusScale(
                                  modifier = Modifier.weight(1f).aspectRatio(16f / 9f),
                                  bg = Color(0xFFF3F6F8),
                                  focusRequester = if (moving == pkg) moveReq else if (i == 0) firstDock else null,
                                  highlighted = moving == pkg,
                                  onLongClick = { moving = pkg },
                                  onClick = { if (moving == null) launchApp(ctx, app) }
                              ) { AppFace(app, Color(0xFF16232C)) }
                          }
                      }
                      FocusScale(
                          modifier = Modifier.weight(1f).aspectRatio(16f / 9f),
                          bg = Color(0x33FFFFFF),
                          onClick = { screen.value = 1 }
                      ) { AllAppsFace() }
                  }
              }
          }

          @Composable
          fun TopBar(prefs: LauncherPrefs, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val fahrenheit = prefs.num("unit") == 1
              val showW = prefs.num("showWeather") == 0
              val temp by produceState<String?>(null, prefs.town, fahrenheit, showW) {
                  if (!showW || prefs.town.isBlank()) {
                      value = null
                  } else {
                      while (true) {
                          value = fetchTemp(prefs.town, fahrenheit)
                          delay(1800000L)
                      }
                  }
              }
              val online by produceState(true) {
                  while (true) {
                      value = isOnline(ctx)
                      delay(15000L)
                  }
              }
              val arrangement: Arrangement.Horizontal = when (prefs.num("barPos")) {
                  0 -> Arrangement.Start
                  2 -> Arrangement.End
                  else -> Arrangement.Center
              }
              Row(
                  Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = arrangement
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      if (showW) {
                          temp?.let { Text(it, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.SemiBold) }
                      }
                      if (prefs.num("showWifi") == 0) {
                          IconBtn(0, !online) { openSystem(ctx, Settings.ACTION_WIFI_SETTINGS) }
                      }
                      if (prefs.num("showSettings") == 0) {
                          IconBtn(1) { openSystem(ctx, Settings.ACTION_SETTINGS) }
                      }
                      IconBtn(2) { screen.value = 2 }
                      if (prefs.num("showClock") == 0) {
                          Clock(prefs.num("hour24") == 1)
                      }
                  }
              }
          }

