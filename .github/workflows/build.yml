          package com.example.tvlauncher

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.SystemClock
          import android.util.Log
          import android.widget.Toast
          import android.view.accessibility.AccessibilityEvent

          val STOCK_LAUNCHERS = setOf(
              "com.google.android.apps.tv.launcherx",
              "com.google.android.tvlauncher",
              "com.google.android.leanbacklauncher"
          )

          class HomeAccessibilityService : AccessibilityService() {
              private var last = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  try {
                      Toast.makeText(this, "NEXUS Home Button is on", Toast.LENGTH_LONG).show()
                  } catch (t: Throwable) {
                      Log.e("TVLauncher", "toast failed", t)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  try {
                      if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                      val pkg = event.packageName?.toString() ?: return
                      if (pkg !in STOCK_LAUNCHERS) return
                      val now = SystemClock.elapsedRealtime()
                      if (now - last < 1000) return
                      last = now
                      val i = Intent(this, MainActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      startActivity(i)
                  } catch (t: Throwable) {
                      Log.e("TVLauncher", "event failed", t)
                  }
              }

              override fun onInterrupt() {}
          }
          __END__
