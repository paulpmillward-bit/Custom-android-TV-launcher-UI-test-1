                          .clip(RoundedCornerShape(26.dp))
                          .background(Color(0x40000000))
                          .padding(22.dp)
                  ) {
                      when (section) {
                          0 -> AppearancePanel(prefs)
                          1 -> HomePanel(prefs)
                          2 -> BarPanel(prefs)
                          else -> AppsPanel(prefs, ordered, onRefreshApps)
                      }
                  }
              }
          }

          @Composable
          fun PanelTitle(t: String) {
              Text(t, color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
          }

          @Composable
          fun SettingLabel(t: String) {
              Text(t, color = Color(0xDDFFFFFF), fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
          }

          @Composable
          fun OptionRow(prefs: LauncherPrefs, o: Opt) {
              val cur = prefs.num(o.key)
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  SettingLabel(o.title)
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      o.choices.forEachIndexed { i, c ->
                          Chip(c, cur == i) { prefs.setNum(o.key, i) }
                      }
                  }
              }
          }

          @Composable
          fun AppearancePanel(prefs: LauncherPrefs) {
              LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(18.dp)) {
                  item { PanelTitle("Appearance") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          SettingLabel("Colour theme")
                          LazyRow(
                              horizontalArrangement = Arrangement.spacedBy(14.dp),
                              contentPadding = PaddingValues(vertical = 8.dp, horizontal = 4.dp)
                          ) {
                              itemsIndexed(THEMES) { i, t ->
                                  FocusScale(
                                      modifier = Modifier.width(112.dp).height(68.dp),
                                      bg = Color.Transparent,
                                      onClick = { prefs.setNum("theme", i) }
                                  ) {
                                      Box(Modifier.fillMaxSize().background(themeBrush(t)))
                                      Text(
                                          t.name,
                                          color = Color.White,
                                          fontSize = 14.sp,
                                          fontWeight = FontWeight.Bold,
                                          modifier = Modifier.align(Alignment.BottomStart).padding(8.dp)
                                      )
                                      if (prefs.num("theme") == i) {
                                          Box(
                                              Modifier
                                                  .align(Alignment.TopEnd)
                                                  .padding(8.dp)
                                                  .size(14.dp)
                                                  .clip(CircleShape)
                                                  .background(Color.White)
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
                  item { OptionRow(prefs, OPT_BG) }
                  item { OptionRow(prefs, OPT_CORNER) }
                  item { OptionRow(prefs, OPT_FOCUS) }
                  item { OptionRow(prefs, OPT_ANIM) }
              }
          }

          @Composable
          fun HomePanel(prefs: LauncherPrefs) {
              LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(18.dp)) {
                  item { PanelTitle("Home screen") }
                  item { OptionRow(prefs, OPT_TOPMODE) }
                  item { OptionRow(prefs, OPT_TOPSIZE) }
                  item { OptionRow(prefs, OPT_DOCK) }
                  item {
                      Text(
                          "Continue watching: " + watchStatus + ". Hold OK on an app on the home screen to move it.",
                          color = Color(0xAAFFFFFF),
                          fontSize = 14.sp
                      )
                  }
              }
          }

          @Composable
          fun BarPanel(prefs: LauncherPrefs) {
              LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(18.dp)) {
                  item { PanelTitle("Top bar") }
                  item { OptionRow(prefs, OPT_BARPOS) }
                  item { OptionRow(prefs, OPT_WEATHER) }
                  item { TownSetting(prefs) }
                  item { OptionRow(prefs, OPT_UNIT) }
                  item { OptionRow(prefs, OPT_WIFI) }
                  item { OptionRow(prefs, OPT_SETBTN) }
                  item { OptionRow(prefs, OPT_CLOCK) }
                  item { OptionRow(prefs, OPT_H24) }
                  item {
                      Text(
                          "The Settings tab always stays on the home screen so you can get back here.",
                          color = Color(0xAAFFFFFF),
                          fontSize = 14.sp
                      )
                  }
              }
          }

          @Composable
          fun AppsPanel(prefs: LauncherPrefs, ordered: List<AppItem>, onRefreshApps: () -> Unit) {
              LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  item { PanelTitle("Apps") }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          Chip("Refresh app icons") { onRefreshApps() }
                      }
                  }
                  item { SettingLabel("Reorder, send to front, or hide apps") }
                  items(ordered, key = { it.component.packageName }) { app ->
                      val pkg = app.component.packageName
                      val isHidden = pkg in prefs.hidden
                      Row(
                          Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Text(
                              app.label + if (isHidden) " (hidden)" else "",
                              color = if (isHidden) Color(0x99FFFFFF) else Color.White,
                              fontSize = 16.sp,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.width(170.dp)
                          )
                          Chip("Up") { prefs.updateOrder(moveInList(ordered, pkg, -1)) }
                          Chip("Down") { prefs.updateOrder(moveInList(ordered, pkg, 1)) }
                          Chip("Front") { prefs.updateOrder(frontInList(ordered, pkg)) }
                          Chip(if (isHidden) "Show" else "Hide") {
                              prefs.updateHidden(if (isHidden) prefs.hidden - pkg else prefs.hidden + pkg)
                          }
                      }
                  }
              }
          }

          @Composable
          fun TownSetting(prefs: LauncherPrefs) {
              var editing by remember { mutableStateOf(false) }
              var text by remember { mutableStateOf(prefs.town) }
              val fr = remember { FocusRequester() }
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  SettingLabel("Weather town")
                  if (!editing) {
                      Chip(
                          if (prefs.town.isBlank()) "Not set - select to enter" else prefs.town + "  (select to change)"
                      ) {
                          text = prefs.town
                          editing = true
                      }
                  } else {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Box(
                              Modifier
                                  .width(280.dp)
                                  .height(44.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(Color(0x33FFFFFF))
                                  .padding(horizontal = 14.dp),
                              contentAlignment = Alignment.CenterStart
                          ) {
                              BasicTextField(
                                  value = text,
                                  onValueChange = { text = it },
                                  singleLine = true,
                                  textStyle = TextStyle(color = Color.White, fontSize = 18.sp),
                                  cursorBrush = SolidColor(Color.White),
                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                                  keyboardActions = KeyboardActions(onDone = {
                                      prefs.updateTown(text.trim())
                                      editing = false
                                  }),
                                  modifier = Modifier.focusRequester(fr)
                              )
                          }
                          Chip("Save") {
                              prefs.updateTown(text.trim())
                              editing = false
                          }
                          Chip("Cancel") { editing = false }
                      }
                      LaunchedEffect(Unit) {
                          delay(100)
                          runCatching { fr.requestFocus() }
                      }
                  }
              }
          }

          // ---------- shared widgets ----------

          @Composable
          fun Chip(text: String, selected: Boolean = false, onClick: () -> Unit) {
              FocusScale(
                  modifier = Modifier.height(42.dp),
                  bg = if (selected) Color(0xFFFFFFFF) else Color(0x33FFFFFF),
                  onClick = onClick
              ) {
                  Text(
                      text,
                      color = if (selected) Color(0xFF0A2535) else Color.White,
                      fontSize = 15.sp,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      modifier = Modifier.padding(horizontal = 16.dp).align(Alignment.Center)
                  )
              }
          }

          @Composable
          fun IconBtn(kind: Int, dim: Boolean = false, onClick: () -> Unit) {
              FocusScale(modifier = Modifier.size(46.dp), bg = Color(0x22FFFFFF), onClick = onClick) {
                  Canvas(Modifier.fillMaxSize().padding(10.dp)) {
                      drawIcon(kind, if (dim) Color(0x77FFFFFF) else Color.White)
                  }
              }
          }

          fun DrawScope.drawIcon(kind: Int, c: Color) {
              val w = size.width
              val h = size.height
              val sw = w * 0.1f
              val st = Stroke(width = sw, cap = StrokeCap.Round)
              when (kind) {
                  0 -> {
                      val cx = w / 2
                      val cy = h * 0.85f
                      for (r in listOf(w * 0.24f, w * 0.44f, w * 0.64f)) {
                          drawArc(c, 225f, 90f, false, Offset(cx - r, cy - r), Size(2 * r, 2 * r), style = st)
                      }
                      drawCircle(c, sw * 0.9f, Offset(cx, cy))
                  }
                  1 -> {
                      drawCircle(c, w * 0.17f, Offset(w / 2, h / 2), style = st)
                      drawCircle(
                          c,
                          w * 0.36f,
                          Offset(w / 2, h / 2),
                          style = Stroke(width = w * 0.16f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(w * 0.14f, w * 0.14f)))
                      )
                  }
                  3 -> {
                      for (a in 0..2) {
                          for (b in 0..2) {
                              drawCircle(c, w * 0.09f, Offset(w * (0.2f + 0.3f * a), h * (0.2f + 0.3f * b)))
                          }
                      }
                  }
                  else -> {
                      val ys = listOf(0.25f, 0.5f, 0.75f)
                      val xs = listOf(0.3f, 0.7f, 0.45f)
                      for (k in 0..2) {
                          val y = h * ys[k]
                          drawLine(c, Offset(0.05f * w, y), Offset(0.95f * w, y), strokeWidth = sw, cap = StrokeCap.Round)
                          drawCircle(c, sw * 1.3f, Offset(w * xs[k], y))
                      }
                  }
              }
          }

          @Composable
          fun AllAppsFace() {
              Column(
                  Modifier.fillMaxSize(),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("+", color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Light)
                  Text("All apps", color = Color(0xCCFFFFFF), fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          @Composable
          fun AppFace(app: AppItem, textColor: Color) {
              if (app.isBanner) {
                  Image(
                      bitmap = app.image,
                      contentDescription = app.label,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.fillMaxSize()
                  )
              } else {
                  Column(
                      Modifier.fillMaxSize(),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Image(bitmap = app.image, contentDescription = null, modifier = Modifier.size(40.dp))
                      Spacer(Modifier.height(6.dp))
                      Text(
                          app.label,
                          color = textColor,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

          @Composable
          fun FocusScale(
              modifier: Modifier = Modifier,
              bg: Color,
              focusRequester: FocusRequester? = null,
              highlighted: Boolean = false,
              onFocus: (() -> Unit)? = null,
              onLongClick: (() -> Unit)? = null,
              onClick: () -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              val st = LocalStyle.current
              var focused by remember { mutableStateOf(false) }
              val target = if (highlighted) st.scale + 0.08f else if (focused) st.scale else 1f
              val scale by animateFloatAsState(target, tween(st.animMs), label = "scale")
              val shape = RoundedCornerShape(st.corner)
              val longDone = remember { BooleanArray(1) }
              val clickNow by rememberUpdatedState(onClick)
              val longNow by rememberUpdatedState(onLongClick)
              val base = if (focusRequester != null) modifier.focusRequester(focusRequester) else modifier
              val borderMod = if (highlighted) {
                  Modifier.border(4.dp, Color(0xFFFFC107), shape)
              } else if (focused && st.highlight != null) {
                  Modifier.border(4.dp, st.highlight, shape)
              } else {
                  Modifier
              }
              Box(
                  base
                      .zIndex(if (focused || highlighted) 1f else 0f)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .clip(shape)
                      .background(bg)
                      .onKeyEvent { ev ->
                          val k = ev.nativeKeyEvent
                          val sel = k.keyCode == AKeyEvent.KEYCODE_DPAD_CENTER ||
                              k.keyCode == AKeyEvent.KEYCODE_ENTER ||
                              k.keyCode == AKeyEvent.KEYCODE_NUMPAD_ENTER
                          if (!sel) {
                              false
                          } else if (k.action == AKeyEvent.ACTION_DOWN) {
                              if (k.repeatCount == 0) {
                                  longDone[0] = false
                              } else if (!longDone[0] && onLongClick != null) {
                                  longDone[0] = true
                                  onLongClick()
                              }
                              true
                          } else if (k.action == AKeyEvent.ACTION_UP) {
                              if (!longDone[0]) onClick()
                              longDone[0] = false
                              true
                          } else {
                              false
                          }
                      }
                      .onFocusChanged {
                          focused = it.isFocused
                          if (it.isFocused) onFocus?.invoke()
                      }
                      .focusable()
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onTap = { clickNow() },
                              onLongPress = { longNow?.invoke() }
                          )
                      }
                      .then(borderMod),
                  content = content
              )
          }

          @Composable
          fun Clock(h24: Boolean) {
              val time by produceState("", h24) {
                  while (true) {
                      value = SimpleDateFormat(if (h24) "HH:mm" else "h:mm", Locale.getDefault()).format(Date())
                      delay(15000L)
                  }
              }
              Text(time, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.SemiBold)
          }

          // ---------- NEXUS splash ----------

          fun DrawScope.drawNexusN(cx: Float, cy: Float, w: Float) {
              val h = w * 46f / 48f
              val left = cx - w / 2f
              val top = cy - h / 2f
              val pts = listOf(
                  0f to 46f, 0f to 0f, 12f to 0f, 36f to 32f, 36f to 0f,
                  48f to 0f, 48f to 46f, 36f to 46f, 12f to 14f, 12f to 46f
              )
              val path = Path()
              pts.forEachIndexed { i, p ->
                  val x = left + p.first / 48f * w
                  val y = top + p.second / 46f * h
                  if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
              }
              path.close()
              val brush = Brush.linearGradient(
                  listOf(Color(0xFF00D1FF), Color(0xFF007BFF)),
                  start = Offset(left, top),
                  end = Offset(left + w, top + h)
              )
              drawPath(path, brush = brush)
              drawPath(path, brush = brush, style = Stroke(width = w * 0.06f, join = StrokeJoin.Round))
          }

          @Composable
          fun NexusSplash(onFinished: () -> Unit) {
              val logoA = remember { Animatable(0f) }
              val nameA = remember { Animatable(0f) }
              val tagA = remember { Animatable(0f) }
              val barP = remember { Animatable(0f) }
              val overall = remember { Animatable(1f) }
              LaunchedEffect(Unit) {
                  coroutineScope {
                      launch { logoA.animateTo(1f, tween(550)) }
                      launch {
                          delay(300L)
                          nameA.animateTo(1f, tween(450))
                      }
                      launch {
                          delay(600L)
                          tagA.animateTo(1f, tween(450))
                      }
                      launch { barP.animateTo(1f, tween(1250, easing = LinearEasing)) }
                      delay(1400L)
                  }
                  overall.animateTo(0f, tween(300))
                  onFinished()
              }
              Box(
                  Modifier
                      .fillMaxSize()
                      .graphicsLayer { alpha = overall.value }
                      .background(Brush.verticalGradient(listOf(Color(0xFF0B1420), Color(0xFF050A12)))),
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(
                          Modifier
                              .size(190.dp)
                              .graphicsLayer {
                                  alpha = logoA.value
                                  scaleX = 0.82f + 0.18f * logoA.value
                                  scaleY = 0.82f + 0.18f * logoA.value
                              },
                          contentAlignment = Alignment.Center
                      ) {
                          Canvas(Modifier.fillMaxSize()) {
                              val c = Offset(size.width / 2f, size.height / 2f)
                              val glowR = size.width * 0.62f
                              drawCircle(
                                  brush = Brush.radialGradient(
                                      listOf(Color(0x6600AAFF), Color.Transparent),
                                      center = c,
                                      radius = glowR
                                  ),
                                  radius = glowR,
                                  center = c
                              )
                              drawNexusN(c.x, c.y, size.width * 0.42f)
                          }
                      }
                      Spacer(Modifier.height(14.dp))
                      Text(
                          "NEXUS",
                          color = Color(0xFFE6F0FF),
                          fontSize = 34.sp,
                          fontWeight = FontWeight.Medium,
                          letterSpacing = 14.sp,
                          modifier = Modifier.graphicsLayer { alpha = nameA.value }
                      )
                      Spacer(Modifier.height(10.dp))
                      Text(
                          "YOUR TV. YOUR WAY.",
                          color = Color(0xFF7FA3C8),
                          fontSize = 13.sp,
                          letterSpacing = 6.sp,
                          modifier = Modifier.graphicsLayer { alpha = tagA.value }
                      )
                      Spacer(Modifier.height(34.dp))
                      Box(
                          Modifier
                              .width(220.dp)
                              .height(3.dp)
                              .graphicsLayer { alpha = tagA.value }
                              .clip(RoundedCornerShape(2.dp))
                              .background(Color(0x22FFFFFF))
                      ) {
                          Box(
                              Modifier
                                  .fillMaxHeight()
                                  .fillMaxWidth(barP.value)
                                  .background(
                                      Brush.horizontalGradient(listOf(Color(0xFF00D1FF), Color(0xFF007BFF)))
                                  )
                          )
                      }
                  }
              }
          }
