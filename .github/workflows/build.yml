          @Composable
          fun NavBar(prefs: LauncherPrefs, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val fahrenheit = prefs.num("unit") == 1
              val showW = prefs.num("showWeather") == 0
              val temp by produceState<String?>(null, prefs.town, fahrenheit, showW) {
                  if (!showW || prefs.town.isBlank()) {
                      value = null
                  } else {
                      while (true) {
                          value = fetchTemp(prefs.town, fahrenheit)
                          delay(1800000L)
                      }
                  }
              }
              val online by produceState(true) {
                  while (true) {
                      value = isOnline(ctx)
                      delay(15000L)
                  }
              }
              val tabsLeft = prefs.num("barPos") == 0
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Canvas(Modifier.size(28.dp)) {
                          drawNexusN(size.width / 2f, size.height / 2f, size.width * 0.85f)
                      }
                      Text(
                          "NEXUS",
                          color = Color(0xFFE6F0FF),
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Medium,
                          letterSpacing = 5.sp
                      )
                  }
                  if (tabsLeft) {
                      Spacer(Modifier.width(28.dp))
                      NavTabs(screen)
                      Spacer(Modifier.weight(1f))
                  } else {
                      Spacer(Modifier.weight(1f))
                      NavTabs(screen)
                      Spacer(Modifier.weight(1f))
                  }
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      if (showW) {
                          temp?.let { Text(it, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.SemiBold) }
                      }
                      if (prefs.num("showWifi") == 0) {
                          IconBtn(0, !online) { openSystem(ctx, Settings.ACTION_WIFI_SETTINGS) }
                      }
                      if (prefs.num("showSettings") == 0) {
                          IconBtn(1) { openSystem(ctx, Settings.ACTION_SETTINGS) }
                      }
                      if (prefs.num("showClock") == 0) {
                          Clock(prefs.num("hour24") == 1)
                      }
                  }
              }
          }

