          fun styleOf(p: LauncherPrefs): UiStyle {
              val corner = when (p.num("corner")) {
                  0 -> 6.dp
                  2 -> 30.dp
                  else -> 18.dp
              }
              var hl: Color? = when (p.num("focus")) {
                  1 -> Color(0xFFFFC107)
                  2 -> Color(0xFF4DD0E1)
                  3 -> null
                  else -> Color.White
              }
              val scale = when (p.num("anim")) {
                  0 -> 1f
                  2 -> 1.12f
                  else -> 1.08f
              }
              val ms = when (p.num("anim")) {
                  0 -> 0
                  2 -> 220
                  else -> 110
              }
              if (hl == null && scale == 1f) hl = Color.White
              return UiStyle(corner, hl, scale, ms)
          }

          fun themeOf(p: LauncherPrefs): ThemeColors = THEMES[p.num("theme").coerceIn(0, THEMES.size - 1)]

          fun bgBrush(p: LauncherPrefs): Brush {
              val t = themeOf(p)
              return when (p.num("bg")) {
                  1 -> SolidColor(t.mid)
                  2 -> SolidColor(t.edge)
                  else -> Brush.verticalGradient(0f to t.edge, 0.36f to t.mid, 0.60f to t.mid, 1f to t.edge)
              }
          }

          fun themeBrush(t: ThemeColors): Brush = Brush.verticalGradient(
              0f to t.edge,
              0.36f to t.mid,
              0.60f to t.mid,
              1f to t.edge
          )

          class LauncherPrefs(ctx: Context) {
              private val sp = ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
              private val ints = mutableStateMapOf<String, Int>()

              init {
                  for ((k, d) in DEFAULTS) {
                      ints[k] = sp.getInt("i_" + k, d)
                  }
              }

              private fun readList(k: String): List<String> =
                  sp.getString(k, "").orEmpty().split(",").filter { it.isNotBlank() }

              var town by mutableStateOf(sp.getString("town", "").orEmpty())
                  private set
              var order by mutableStateOf(readList("order"))
                  private set
              var hidden by mutableStateOf(readList("hidden").toSet())
                  private set

              fun num(k: String): Int = ints[k] ?: (DEFAULTS[k] ?: 0)

              fun setNum(k: String, v: Int) {
                  ints[k] = v
                  sp.edit().putInt("i_" + k, v).apply()
              }

              fun updateTown(v: String) {
                  town = v
                  sp.edit().putString("town", v).apply()
              }

              fun updateOrder(v: List<String>) {
                  order = v
                  sp.edit().putString("order", v.joinToString(",")).apply()
              }

              fun updateHidden(v: Set<String>) {
                  hidden = v
                  sp.edit().putString("hidden", v.joinToString(",")).apply()
              }
          }

          // ---------- activity ----------

          class MainActivity : ComponentActivity() {
              private val refresh = mutableIntStateOf(0)
              private val screen = mutableStateOf(0)
              private val showSplash = mutableStateOf(true)

              override fun onCreate(savedInstanceState: Bundle?) {
                  installSplashScreen()
                  super.onCreate(savedInstanceState)
                  onBackPressedDispatcher.addCallback(this) {
                      if (screen.value != 0) screen.value = 0
                  }
                  setContent {
                      Box(Modifier.fillMaxSize()) {
                          LauncherScreen(refresh.intValue, screen)
                          if (showSplash.value) {
                              NexusSplash { showSplash.value = false }
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  screen.value = 0
                  refresh.intValue = refresh.intValue + 1
              }
          }

          // ---------- loading ----------

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val leanback = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
              val normal = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              val found = (pm.queryIntentActivities(leanback, 0) + pm.queryIntentActivities(normal, 0))
                  .filter { it.activityInfo.packageName != ctx.packageName }
                  .filter { it.activityInfo.packageName !in STOCK_LAUNCHERS }
                  .distinctBy { it.activityInfo.packageName }
              return found.map { ri ->
                  val ai = ri.activityInfo
                  val comp = ComponentName(ai.packageName, ai.name)
                  APP_CACHE.getOrPut(comp.flattenToString()) {
                      val banner = ai.loadBanner(pm)
                      val bmp = if (banner != null) banner.toBitmap(320, 180) else ai.loadIcon(pm).toBitmap(128, 128)
                      AppItem(ri.loadLabel(pm).toString(), comp, bmp.asImageBitmap(), banner != null)
                  }
              }.sortedBy { it.label.lowercase() }
          }

          fun recentPackages(ctx: Context): List<String> =
              ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
                  .getString("recent", "").orEmpty().split(",").filter { it.isNotBlank() }

          fun pushRecent(ctx: Context, pkg: String) {
              val list = (listOf(pkg) + recentPackages(ctx).filter { it != pkg }).take(8)
              ctx.getSharedPreferences("launcher", Context.MODE_PRIVATE)
                  .edit().putString("recent", list.joinToString(",")).apply()
          }

          fun launchApp(ctx: Context, app: AppItem) {
              pushRecent(ctx, app.component.packageName)
              runCatching {
                  ctx.startActivity(
                      Intent(Intent.ACTION_MAIN).setComponent(app.component).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }

          fun openSystem(ctx: Context, action: String) {
              runCatching {
                  ctx.startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }

          fun isOnline(ctx: Context): Boolean = try {
              val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              val caps = cm.getNetworkCapabilities(cm.activeNetwork)
              caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
          } catch (e: Exception) {
              true
          }

          fun httpGet(u: String): String {
              val c = URL(u).openConnection() as HttpURLConnection
              c.connectTimeout = 8000
              c.readTimeout = 8000
              return try {
                  c.inputStream.bufferedReader().readText()
              } finally {
                  c.disconnect()
              }
          }

          suspend fun fetchTemp(town: String, fahrenheit: Boolean): String? = withContext(Dispatchers.IO) {
              try {
                  val g = httpGet("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + URLEncoder.encode(town, "UTF-8"))
                  val results = JSONObject(g).optJSONArray("results") ?: return@withContext null
                  val o = results.getJSONObject(0)
                  val lat = o.getDouble("latitude")
                  val lon = o.getDouble("longitude")
                  val unit = if (fahrenheit) "&temperature_unit=fahrenheit" else ""
                  val w = httpGet("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m" + unit)
                  val t = JSONObject(w).getJSONObject("current").getDouble("temperature_2m")
                  Math.round(t).toInt().toString() + "\u00B0"
              } catch (e: Exception) {
                  null
              }
          }

          fun loadBitmap(ctx: Context, uriStr: String?): ImageBitmap? {
              if (uriStr.isNullOrBlank()) return null
              IMG_CACHE[uriStr]?.let { return it }
              return try {
                  val u = Uri.parse(uriStr)
                  val stream = if (u.scheme == "http" || u.scheme == "https") {
                      URL(uriStr).openStream()
                  } else {
                      ctx.contentResolver.openInputStream(u)
                  }
                  val bytes = stream?.use { it.readBytes() } ?: return null
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                  var sample = 1
                  while (o.outWidth / sample > 900) sample *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = sample
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o2)?.asImageBitmap()
                  if (bmp != null) {
                      if (IMG_CACHE.size > 30) IMG_CACHE.clear()
                      IMG_CACHE[uriStr] = bmp
                  }
                  bmp
              } catch (e: Exception) {
                  null
              }
          }

          fun readUriBytes(ctx: Context, uriStr: String): ByteArray? = try {
              val u = Uri.parse(uriStr)
              val stream = if (u.scheme == "http" || u.scheme == "https") {
                  URL(uriStr).openStream()
              } else {
                  ctx.contentResolver.openInputStream(u)
              }
              stream?.use { it.readBytes() }
          } catch (e: Exception) {
              null
          }

          fun loadBest(ctx: Context, a: String?, b: String?): ImageBitmap? {
              val key = "best:" + a + "|" + b
              IMG_CACHE[key]?.let { return it }
              val cands = ArrayList<Pair<ByteArray, IntArray>>()
              for (u in listOf(a, b)) {
                  if (u.isNullOrBlank()) continue
                  val bytes = readUriBytes(ctx, u) ?: continue
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                  if (o.outWidth > 0 && o.outHeight > 0) {
                      cands.add(Pair(bytes, intArrayOf(o.outWidth, o.outHeight)))
                  }
              }
              if (cands.isEmpty()) return null
              val best = cands.maxByOrNull { c ->
                  val landscape = c.second[0] >= c.second[1] * 12 / 10
                  (if (landscape) 1000000 else 0) + c.second[0]
              } ?: return null
              var sample = 1
              while (best.second[0] / sample > 2000) sample *= 2
              val o2 = BitmapFactory.Options()
              o2.inSampleSize = sample
              val bmp = BitmapFactory.decodeByteArray(best.first, 0, best.first.size, o2)?.asImageBitmap()
              if (bmp != null) {
                  if (IMG_CACHE.size > 24) IMG_CACHE.clear()
                  IMG_CACHE[key] = bmp
              }
              return bmp
          }

          fun loadWatchNext(ctx: Context): WatchResult {
              try {
                  val cur = ctx.contentResolver.query(
                      Uri.parse("content://android.media.tv/watch_next_program"),
                      null, null, null, "last_engagement_time_utc_millis DESC"
                  ) ?: return WatchResult(emptyList(), "no data returned")
                  val out = ArrayList<WatchItem>()
                  var rows = 0
                  cur.use { c ->
                      val iTitle = c.getColumnIndex("title")
                      val iPoster = c.getColumnIndex("poster_art_uri")
                      val iThumb = c.getColumnIndex("thumbnail_uri")
                      val iIntent = c.getColumnIndex("intent_uri")
                      val iPos = c.getColumnIndex("last_playback_position_millis")
                      val iDur = c.getColumnIndex("duration_millis")
                      val iType = c.getColumnIndex("watch_next_type")
                      val iPkg = c.getColumnIndex("package_name")
                      val iSeason = c.getColumnIndex("season_display_number")
                      val iEp = c.getColumnIndex("episode_display_number")
                      while (c.moveToNext() && out.size < 8) {
                          rows++
                          val type = if (iType >= 0) c.getInt(iType) else 0
                          if (type > 1) continue
                          val intentUri: String? = if (iIntent >= 0) c.getString(iIntent) else null
                          if (intentUri.isNullOrBlank()) continue
                          val title = if (iTitle >= 0) c.getString(iTitle).orEmpty() else ""
                          val posterA: String? = if (iPoster >= 0) c.getString(iPoster) else null
                          val posterB: String? = if (iThumb >= 0) c.getString(iThumb) else null
                          val pos = if (iPos >= 0) c.getLong(iPos) else 0L
                          val dur = if (iDur >= 0) c.getLong(iDur) else 0L
                          val prog = if (dur > 0) (pos.toFloat() / dur.toFloat()).coerceIn(0f, 1f) else 0f
                          val pkg: String? = if (iPkg >= 0) c.getString(iPkg) else null
                          val season: String = if (iSeason >= 0) c.getString(iSeason).orEmpty() else ""
                          val episode: String = if (iEp >= 0) c.getString(iEp).orEmpty() else ""
                          val parts = ArrayList<String>()
                          if (season.isNotBlank() && episode.isNotBlank()) {
                              parts.add("S" + season + " E" + episode)
                          } else if (episode.isNotBlank()) {
                              parts.add("Episode " + episode)
                          }
                          if (dur > 0 && pos > 0 && dur > pos) {
                              parts.add(((dur - pos) / 60000L).toString() + " min remaining")
                          }
                          var badge: ImageBitmap? = null
                          if (pkg != null) {
                              badge = IMG_CACHE["badge:" + pkg]
                              if (badge == null) {
                                  badge = try {
                                      ctx.packageManager.getApplicationIcon(pkg).toBitmap(96, 96).asImageBitmap()
                                  } catch (e: Exception) {
                                      null
                                  }
                                  if (badge != null) IMG_CACHE["badge:" + pkg] = badge
                              }
                          }
                          out.add(WatchItem(title, intentUri, loadBest(ctx, posterA, posterB), badge, prog, parts.joinToString("  \u00B7  ")))
                      }
                  }
                  val status = if (out.isNotEmpty()) {
                      "OK, " + out.size + " items"
                  } else {
                      "allowed but nothing to show (" + rows + " rows)"
                  }
                  return WatchResult(out, status)
              } catch (e: Exception) {
                  return WatchResult(emptyList(), "not available: " + (e.message ?: e.javaClass.simpleName))
              }
          }

          fun openWatch(ctx: Context, w: WatchItem) {
              runCatching {
                  ctx.startActivity(
                      Intent.parseUri(w.intentUri, Intent.URI_INTENT_SCHEME).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }

          fun moveInList(ordered: List<AppItem>, pkg: String, delta: Int): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              val i = l.indexOf(pkg)
              if (i < 0) return l
              val j = (i + delta).coerceIn(0, l.size - 1)
              l.removeAt(i)
              l.add(j, pkg)
              return l
          }

          fun frontInList(ordered: List<AppItem>, pkg: String): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              l.remove(pkg)
              l.add(0, pkg)
              return l
          }

          fun swapInList(ordered: List<AppItem>, a: String, b: String): List<String> {
              val l = ordered.map { it.component.packageName }.toMutableList()
              val i = l.indexOf(a)
              val j = l.indexOf(b)
              if (i < 0 || j < 0) return l
              l[i] = b
              l[j] = a
              return l
          }

          // ---------- root ----------

          @Composable
          fun LauncherScreen(refresh: Int, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val prefs = remember { LauncherPrefs(ctx) }
              var reload by remember { mutableIntStateOf(0) }
              val apps by produceState(emptyList<AppItem>(), refresh, reload) {
                  value = withContext(Dispatchers.Default) { loadApps(ctx) }
              }
              val ordered = remember(apps, prefs.order) {
                  val idx = prefs.order.withIndex().associate { it.value to it.index }
                  apps.sortedWith(
                      compareBy<AppItem>(
                          { idx[it.component.packageName] ?: Int.MAX_VALUE },
                          { it.label.lowercase() }
                      )
                  )
              }
              val style = remember(prefs.num("corner"), prefs.num("focus"), prefs.num("anim")) { styleOf(prefs) }
              CompositionLocalProvider(LocalStyle provides style) {
                  when (screen.value) {
                      1 -> AllAppsScreen(prefs, ordered)
                      2 -> SettingsScreen(
                          prefs,
                          ordered,
                          onDone = { screen.value = 0 },
                          onRefreshApps = {
                              APP_CACHE.clear()
                              reload = reload + 1
                          }
                      )
                      else -> HomeScreen(prefs, ordered, refresh, screen)
                  }
              }
          }

          // ---------- home ----------

          @Composable
          fun HomeScreen(prefs: LauncherPrefs, ordered: List<AppItem>, refresh: Int, screen: MutableState<Int>) {
              val ctx = LocalContext.current
              val st = LocalStyle.current
              val th = themeOf(prefs)
              val visible = ordered.filter { it.component.packageName !in prefs.hidden }
              val dockN = 3 + prefs.num("dockCount").coerceIn(0, 2)
              val dockApps = visible.take(dockN)
              val topMode = prefs.num("topMode")
              val cw = TOP_W[prefs.num("topSize").coerceIn(0, 2)]

              val watch by produceState(WatchResult(emptyList(), ""), refresh, topMode) {
                  if (topMode == 0) {
                      while (true) {
                          val r = withContext(Dispatchers.IO) { loadWatchNext(ctx) }
                          watchStatus = r.status
                          value = r
                          delay(120000L)
                      }
                  } else {
                      value = WatchResult(emptyList(), "off")
                  }
              }

              var moving by remember { mutableStateOf<String?>(null) }
              val firstDock = remember { FocusRequester() }
              val moveReq = remember { FocusRequester() }
              val heroIdx = remember { mutableIntStateOf(0) }
              LaunchedEffect(dockApps.size) {
                  if (dockApps.isNotEmpty()) {
                      delay(150)
                      runCatching { firstDock.requestFocus() }
                  }
              }
              LaunchedEffect(prefs.order, moving) {
                  if (moving != null) {
                      delay(40)
                      runCatching { moveReq.requestFocus() }
                  }
              }

              val showWatch = topMode == 0 && watch.items.isNotEmpty()

              Box(Modifier.fillMaxSize().background(bgBrush(prefs))) {
                  HeroBackdrop(watch.items, showWatch, heroIdx, th)
                  Column(
                      Modifier
                          .fillMaxSize()
                          .padding(horizontal = 36.dp, vertical = 16.dp)
                          .onPreviewKeyEvent { ev ->
                              val m = moving
                              val k = ev.nativeKeyEvent
                              val code = k.keyCode
                              val isSel = code == AKeyEvent.KEYCODE_DPAD_CENTER ||
                                  code == AKeyEvent.KEYCODE_ENTER ||
                                  code == AKeyEvent.KEYCODE_NUMPAD_ENTER
                              val isLR = code == AKeyEvent.KEYCODE_DPAD_LEFT || code == AKeyEvent.KEYCODE_DPAD_RIGHT
                              if (m == null) {
                                  false
                              } else if (k.action == AKeyEvent.ACTION_UP) {
                                  isSel || isLR
                              } else if (isLR) {
                                  val i = dockApps.indexOfFirst { it.component.packageName == m }
                                  val j = if (code == AKeyEvent.KEYCODE_DPAD_LEFT) i - 1 else i + 1
                                  if (i >= 0 && j in dockApps.indices) {
                                      prefs.updateOrder(swapInList(ordered, m, dockApps[j].component.packageName))
                                  }
                                  true
                              } else if (isSel) {
                                  if (k.repeatCount == 0) moving = null
                                  true
                              } else if (code == AKeyEvent.KEYCODE_BACK) {
                                  moving = null
                                  true
                              } else {
                                  moving = null
                                  false
                              }
                          }
                  ) {
                      NavBar(prefs, screen)
                      Box(
                          Modifier.weight(1f).fillMaxWidth().padding(start = 4.dp, bottom = 12.dp),
                          contentAlignment = Alignment.BottomStart
                      ) {
                          HeroSection(watch.items, showWatch, heroIdx) { openWatch(ctx, it) }
                      }
                      Text(
                          if (moving != null) "Moving: use the left and right buttons, then press OK to drop" else "Your Apps",
                          color = if (moving != null) Color(0xFFFFC107) else Color.White,
                          fontSize = 15.sp,
                          fontWeight = FontWeight.SemiBold,
                          modifier = Modifier.padding(start = 4.dp)
                      )
                      Row(
                          Modifier.fillMaxWidth().padding(vertical = 10.dp, horizontal = 4.dp),
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          dockApps.forEachIndexed { i, app ->
                              val pkg = app.component.packageName
                              key(pkg) {
                                  FocusScale(
                                      modifier = Modifier.width(118.dp).aspectRatio(16f / 9f),
                                      bg = Color(0xFFF3F6F8),
                                      focusRequester = if (moving == pkg) moveReq else if (i == 0) firstDock else null,
                                      highlighted = moving == pkg,
                                      onLongClick = { moving = pkg },
                                      onClick = { if (moving == null) launchApp(ctx, app) }
                                  ) { AppFace(app, Color(0xFF16232C)) }
                              }
                          }
                          FocusScale(
                              modifier = Modifier.width(118.dp).aspectRatio(16f / 9f),
                              bg = Color(0x33FFFFFF),
                              onClick = { screen.value = 1 }
                          ) { AllAppsFace() }
                      }
                      if (showWatch) {
                          Text(
                              "Continue Watching",
                              color = Color.White,
                              fontSize = 15.sp,
                              fontWeight = FontWeight.SemiBold,
                              modifier = Modifier.padding(start = 4.dp)
                          )
                          LazyRow(
                              horizontalArrangement = Arrangement.spacedBy(14.dp),
                              contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                          ) {
                              itemsIndexed(watch.items) { i, w ->
                                  Column(Modifier.width(cw.dp)) {
                                      FocusScale(
                                          modifier = Modifier.fillMaxWidth().aspectRatio(16f / 9f),
                                          bg = Color(0xFF0E2E40),
                                          onFocus = { heroIdx.intValue = i },
                                          onClick = { openWatch(ctx, w) }
                                      ) {
                                          if (w.poster != null) {
                                              Image(
                                                  bitmap = w.poster,
                                                  contentDescription = w.title,
                                                  contentScale = ContentScale.Crop,
                                                  modifier = Modifier.fillMaxSize()
                                              )
                                          } else {
                                              Text(
                                                  w.title,
                                                  color = Color.White,
                                                  fontSize = 14.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  modifier = Modifier.align(Alignment.Center)
                                              )
                                          }
                                          Box(
                                              Modifier
                                                  .align(Alignment.BottomStart)
                                                  .padding(horizontal = 8.dp, vertical = 6.dp)
                                                  .fillMaxWidth()
                                                  .height(3.dp)
                                                  .background(Color(0x66FFFFFF))
                                          ) {
                                              Box(Modifier.fillMaxWidth(w.progress).fillMaxHeight().background(Color(0xFF00D1FF)))
                                          }
                                          if (w.badge != null) {
                                              Image(
                                                  bitmap = w.badge,
                                                  contentDescription = null,
                                                  modifier = Modifier
                                                      .align(Alignment.TopEnd)
                                                      .padding(6.dp)
                                                      .size(20.dp)
                                                      .clip(RoundedCornerShape(5.dp))
                                              )
                                          }
                                      }
                                      Spacer(Modifier.height(6.dp))
                                      Text(
                                          w.title,
                                          color = Color.White,
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

